<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 キャラクターカードジェネレーター</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h1>FF14 キャラカジェネレーター</h1>

    <div class="form-container">
        <div class="form-group">
            <label for="bgImage">1. 背景画像を選択 (スクリーンショットなど)</label>
            <input type="file" id="bgImage" accept="image/*">
        </div>
        <div class="form-group">
            <label for="charName">2. キャラクター名 (Character Name)</label>
            <input type="text" id="charName" placeholder="Namae Choco">
        </div>
        <div class="form-group">
            <label for="serverName">3. 所属データセンター / ワールド</label>
            <input type="text" id="serverName" placeholder="Mana / Chocobo">
        </div>
        <div class="form-group">
            <label for="mainJob">4. メインジョブ</label>
            <select id="mainJob">
                <option value="ナイト">ナイト (Paladin)</option>
                <option value="戦士">戦士 (Warrior)</option>
                <option value="暗黒騎士">暗黒騎士 (Dark Knight)</option>
                <option value="ガンブレイカー">ガンブレイカー (Gunbreaker)</option>
                <option value="白魔道士">白魔道士 (White Mage)</option>
                <option value="学者">学者 (Scholar)</option>
                <option value="占星術師">占星術師 (Astrologian)</option>
                <option value="賢者">賢者 (Sage)</option>
                <option value="モンク">モンク (Monk)</option>
                <option value="竜騎士">竜騎士 (Dragoon)</option>
                <option value="忍者">忍者 (Ninja)</option>
                <option value="侍">侍 (Samurai)</option>
                <option value="リーパー">リーパー (Reaper)</option>
                <option value="ヴァイパー">ヴァイパー (Viper)</option>
                <option value="吟遊詩人">吟遊詩人 (Bard)</option>
                <option value="機工士">機工士 (Machinist)</option>
                <option value="踊り子">踊り子 (Dancer)</option>
                <option value="黒魔道士">黒魔道士 (Black Mage)</option>
                <option value="召喚士">召喚士 (Summoner)</option>
                <option value="赤魔道士">赤魔道士 (Red Mage)</option>
                <option value="ピクトマンサー">ピクトマンサー (Pictomancer)</option>
            </select>
        </div>

        <button type="button" id="generateBtn">カードを生成する</button>
    </div>

    <div class="output-container">
        <canvas id="cardCanvas"></canvas>
        <img id="resultImage" alt="生成されたキャラクターカード">
        <p class="download-note" id="downloadNote">画像を長押しして保存してください</p>
    </div>

    <footer>
        <p>(C) SQUARE ENIX CO., LTD. All Rights Reserved.</p>
        <p>※本サイトは非公式のファンサイトです。</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
