<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 キャラクターカードジェネレーター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Meow+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>FF14 キャラカジェネレーター</h1>

    <div class="form-container">
        <div class="form-group">
            <label>🖼️ カードの向き（解像度）※表面のみ適用</label>
            <div class="radio-list-row">
                <label><input type="radio" name="cardOrientation" value="horizontal" checked> 横型</label>
                <label><input type="radio" name="cardOrientation" value="vertical"> 縦型</label>
            </div>
        </div>

        <div class="form-group-box">
            <label>🧭 画面レイアウトの配置パターン</label>
            <div class="radio-list">
                <label>
                    <input type="radio" name="layoutPattern" value="A" checked> 
                    <span><strong>パターンA:</strong> 名前【右上】 ＆ プロフィール【左下】</span>
                </label>
                <label style="margin-top: 4px;">
                    <input type="radio" name="layoutPattern" value="B"> 
                    <span><strong>パターンB:</strong> 名前【right下】 ＆ プロフィール【左上】</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="themeColorPicker">🎨 変更：テーマカラー（裏面の背景色）</label>
            <input type="color" id="themeColorPicker" value="#c59b4c" style="width:100%; height:40px; cursor:pointer; border:1px solid #3e3e4a; border-radius:4px;">
        </div>

        <!-- 🆕 裏面の文字色選択（白 or 黒） -->
        <div class="form-group-box">
            <label>🌓 裏面の文字色</label>
            <div class="radio-list-row">
                <label><input type="radio" name="backTextColor" value="#ffffff" checked> ⚪ 白文字</label>
                <label><input type="radio" name="backTextColor" value="#000000"> ⚫ 黒文字</label>
            </div>
        </div>

        <div class="form-group-box">
            <label>✍️ 表面テキストカスタム（名前＆ワールド名）</label>
            <div class="form-group-row">
                <div>
                    <span class="sub-label">フォントスタイル</span>
                    <select id="textFontFamily">
                        <option value="sans-serif">角ゴシック</option>
                        <option value="'Hiragino Mincho ProN', serif">明朝体</option>
                        <option value="'Yu Gothic', sans-serif">UIゴシック</option>
                        <option value="'Hachi Maru Pop', cursive">手書き風(Hachi Maru)</option>
                    </select>
                </div>
                <div>
                    <span class="sub-label">文字の色</span>
                    <input type="color" id="textColorPicker" value="#ffffff" style="width:100%; height:40px; cursor:pointer; border:1px solid #3e3e4a; border-radius:4px;">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="bgImage">1. 背景画像を選択</label>
            <input type="file" id="bgImage" accept="image/*">
        </div>
        
        <div class="form-group">
            <label for="charName">2. キャラクター名</label>
            <input type="text" id="charName" placeholder="Namae Choco">
        </div>

        <div class="form-group">
            <label for="backComment">3. 裏面用自由コメント（改行できます）</label>
            <textarea id="backComment" rows="3" placeholder="いつも遊んでくれてありがとう！&#13;&#10;これからもよろしくね！"></textarea>
        </div>
        
        <div class="form-group">
            <label for="dcSelect">4. 所属データセンター (DC)</label>
            <select id="dcSelect">
                <option value="">選択してください</option>
                <option value="Secret">Secret (非表示)</option>
                <option value="Elemental">Elemental</option>
                <option value="Gaia">Gaia</option>
                <option value="Mana">Mana</option>
                <option value="Meteor">Meteor</option>
            </select>
        </div>

        <div class="form-group">
            <label for="worldSelect">5. 所属ワールド (World)</label>
            <select id="worldSelect" disabled>
                <option value="">先にDCを選択してください</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mainJob">6. メインジョブ</label>
            <select id="mainJob">
                <optgroup label="🛡️ タンク (TANK)">
                    <option value="ナイト">ナイト</option>
                    <option value="戦士">戦士</option>
                    <option value="暗黒騎士">暗黒騎士</option>
                    <option value="ガンブレイカー">ガンブレイカー</option>
                </optgroup>
                <optgroup label="🟢 ヒーラー (HEALER)">
                    <option value="白魔道士">白魔道士</option>
                    <option value="学者">学者</option>
                    <option value="占星術師">占星術師</option>
                    <option value="賢者">賢者</option>
                </optgroup>
                <optgroup label="🔴 メレーDPS">
                    <option value="モンク">モンク</option>
                    <option value="竜騎士">竜騎士</option>
                    <option value="忍者">忍者</option>
                    <option value="侍">侍</option>
                    <option value="リーパー">リーパー</option>
                    <option value="ヴァイパー">ヴァイパー</option>
                </optgroup>
                <optgroup label="🟢 レンジDPS">
                    <option value="吟遊詩人">吟遊詩人</option>
                    <option value="機工士">機工士</option>
                    <option value="踊り子">踊り子</option>
                </optgroup>
                <optgroup label="🟣 キャスターDPS">
                    <option value="黒魔道士">黒魔道士</option>
                    <option value="召喚士">召喚士</option>
                    <option value="赤魔道士">赤魔道士</option>
                    <option value="ピクトマンサー">ピクトマンサー</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label>7. プレイスタイル</label>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="style" value="ストーリー"> ストーリー</label>
                <label><input type="checkbox" name="style" value="レイド戦闘"> レイド戦闘</label>
                <label><input type="checkbox" name="style" value="ギャザクラ"> ギャザクラ</label>
                <label><input type="checkbox" name="style" value="SS撮影"> SS撮影</label>
                <label><input type="checkbox" name="style" value="ハウジング"> ハウジング</label>
                <label><input type="checkbox" name="style" value="雑談/RP"> 雑談/RP</label>
                <label><input type="checkbox" name="style" value="PvP"> PvP</label>
                <label><input type="checkbox" name="style" value="ミラプリ"> ミラプリ</label>
            </div>
        </div>

        <div class="form-group">
            <label>8. 好きな種族</label>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="race" value="Hyur"> Hyur</label>
                <label><input type="checkbox" name="race" value="Elezen"> Elezen</label>
                <label><input type="checkbox" name="race" value="Lalafell"> Lalafell</label>
                <label><input type="checkbox" name="race" value="Miqo'te"> Miqo'te</label>
                <label><input type="checkbox" name="race" value="Roegadyn"> Roegadyn</label>
                <label><input type="checkbox" name="race" value="Au Ra"> Au Ra</label>
                <label><input type="checkbox" name="race" value="Hrothgar"> Hrothgar</label>
                <label><input type="checkbox" name="race" value="Viera"> Viera</label>
            </div>
        </div>

        <div class="form-group">
            <label>9. 最新ストーリー進行度</label>
            <div class="radio-list">
                <label><input type="radio" name="progress" value="0" checked> 新生エオルゼア</label>
                <label><input type="radio" name="progress" value="1"> 蒼天のイシュガルド</label>
                <label><input type="radio" name="progress" value="2"> 紅蓮のリベレーター</label>
                <label><input type="radio" name="progress" value="3"> 漆黒のヴィランズ</label>
                <label><input type="radio" name="progress" value="4"> 暁月のフィナーレ</label>
                <label><input type="radio" name="progress" value="5"> 黄金のレガシー</label>
            </div>
        </div>
    </div>

    <div class="output-container">
        <h2>✨ プレビュー（表面） ✨</h2>
        <canvas id="cardCanvas"></canvas>
        <img id="resultImage" alt="表面プレビュー">
        
        <h2 style="margin-top: 30px;">✨ プレビュー（裏面 / トレカ風） ✨</h2>
        <canvas id="cardCanvasBack"></canvas>
        <img id="resultImageBack" alt="裏面プレビュー">
        
        <p class="download-note">画像を長押しして保存してください</p>
    </div>

    <footer>
        <p>(C) SQUARE ENIX CO., LTD. All Rights Reserved.</p>
        <p>※本サイトは非公式のファンサイトです。</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
